[package]
name = "index-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM + C ABI binding for index-text. No wasm-bindgen: one artifact serves the browser, Node, and native FFI."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
index-text = { path = "../index-text" }

# The image tier. It is itself dependency-free (no model, no ONNX runtime, no image decoder — an
# embedding is an INPUT), so adding it here costs the artifact its own code and nothing else, which
# is the only reason a browser-shippable image search is possible at all.
index-image = { path = "../index-image" }

# Profiles are set at the workspace root; a per-package profile would be ignored anyway.
