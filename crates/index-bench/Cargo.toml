path = "src/emit_artifact.rs"

[[bin]]
name = "sisia-catalog"
path = "src/sisia_catalog.rs"

[[bin]]
name = "sfc-2d"
path = "src/sfc_2d.rs"

[[bin]]
name = "geo-join"
path = "src/geo_join.rs"

[[bin]]
name = "maphy-place"
path = "src/maphy_place.rs"

[[bin]]
name = "presyo-prior"
path = "src/presyo_prior.rs"

[[bin]]
name = "presyo-broad"
path = "src/presyo_broad.rs"

[[bin]]
name = "presyo-catalog"
