name: gate

# The gate this repo has been claiming since 2026-06-19 and did not have.
# "Green" previously meant "green on one Windows box"; it now means green on Linux CI too.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The artifact that makes the engine usable outside Rust must keep building, or "works in
      # any language" silently stops being true.
      - name: WASM artifacts
        run: |
          cargo build -p index-wasm     --release --target wasm32-unknown-unknown
          cargo build -p index-geo-wasm --release --target wasm32-unknown-unknown
          cargo build -p index-accel    --release --target wasm32-unknown-unknown
          ls -l target/wasm32-unknown-unknown/release/index_wasm.wasm
          ls -l target/wasm32-unknown-unknown/release/index_geo_wasm.wasm
          ls -l target/wasm32-unknown-unknown/release/index_accel.wasm

      - name: WASM loads and answers a query in Node
        run: node js/smoke.mjs

      # The image tier through the SAME C ABI, in Node. This is hermetic -- it builds its index
      # in-process and needs no corpus -- so unlike `image-corpus` (whose 17,311-file scrape is
      # machine-local and skips cleanly when absent) it belongs in the gate. It asserts the ABI
      # version, a fused query's exact ordering against one computed in JS, and that the vector arm
      # does not leak a facet filter -- the defect `bench/roadmap/p59-image-fusion.md` exists to
      # catch.
      - name: The image tier answers a fused query in Node
        run: node js/image-smoke.mjs

      # The CLI is the only surface a database administrator ever touches, so "it builds" is not
      # enough: this drives `build`, `apply` and `search` end to end over a pipe, exactly as the
      # README tells people to, and asserts that applying a change stream converges on the same
      # answers as rebuilding from the final state.
      - name: CLI builds an index from a pipe and keeps it current
        run: bash scripts/cli-smoke.sh

      # This one is a correctness gate, not a performance gate. `geo-bench` asserts that the WASM
      # index and a pure-JS scan return the IDENTICAL polygon for every one of 53,715 real points,
      # and throws otherwise. The timings it prints are informational here — CI runners are far too
      # noisy to gate on — but the agreement is not negotiable, and it is what caught every bug in
      # `bench/roadmap/p10-geo-join.md`.
      - name: Geo WASM agrees with a scan on every point
        run: |
          node js/geo-bench.mjs
          INDEX_BENCH_PROVINCE=bench/fixture/maphy-province.txt node js/geo-bench.mjs

      # The benchmarks under bench/roadmap/ are DELIBERATELY excluded: they are specs for
      # not-yet-finished work and are expected red. A roadmap's red tests are a feature; a
      # roadmap's red gate is a bug. The two that need sibling checkouts (`real-corpus`, `scale`)
      # cannot run here at all and must not be faked — see bench/README.md.
      - name: Benchmarks build (not run)
        run: cargo build --workspace --release --all-targets
